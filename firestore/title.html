<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title — VEYORA</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/search.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="home.html">VEYORA</a>
    <nav><a href="home.html">Home</a><a href="search.html">Search</a><a href="watchlist.html">My Library</a><a href="profile.html">Profile</a></nav>
</header>
<main class="search-page">
    <div id="details" class="media-card"></div>
</main>
<script type="module">
import { getAnimeDetails, animePoster } from "./js/api/jikan.js";
import { getTMDBDetails, tmdbPoster, tmdbBackdrop } from "./js/api/tmdb.js";

const params = new URLSearchParams(location.search);
const source = params.get("source");
const id = params.get("id");
const type = params.get("type");
const el = document.querySelector("#details");

try {
    let data;
    let title, poster, backdrop, description, rating, year, genres = [];

    if (source === "jikan") {
        data = await getAnimeDetails(id);
        const a = data.data;
        title = a.title;
        poster = animePoster(a);
        description = a.synopsis || "No description available.";
        rating = a.score;
        year = a.year || a.aired?.from?.slice(0,4);
        genres = (a.genres || []).map(x => x.name);
    } else {
        data = await getTMDBDetails(id, type);
        title = type === "movie" ? data.title : data.name;
        poster = tmdbPoster(data.poster_path);
        backdrop = tmdbBackdrop(data.backdrop_path);
        description = data.overview || "No description available.";
        rating = data.vote_average;
        year = (type === "movie" ? data.release_date : data.first_air_date)?.slice(0,4);
        genres = (data.genres || []).map(x => x.name);
    }

    el.innerHTML = `
        ${backdrop ? `<img src="${backdrop}" alt="" style="width:100%;max-height:420px;object-fit:cover">` : ""}
        <div class="media-info">
            <img src="${poster}" alt="${title}" style="width:180px;max-width:45%;border-radius:12px">
            <span class="badge">${type === "anime" ? "Anime" : type === "movie" ? "Movie" : "TV / Drama"}</span>
            <h1>${escapeHtml(title)}</h1>
            <p>${escapeHtml(year || "Year unknown")} ${rating ? `• ⭐ ${Number(rating).toFixed(1)}` : ""}</p>
            <p>${escapeHtml(genres.join(" • "))}</p>
            <p>${escapeHtml(description)}</p>
            <button class="details-btn" disabled title="Library is coming in Phase 4">+ Add to My Library — Phase 4</button>
        </div>
    `;
} catch (error) {
    el.innerHTML = `<div class="media-info"><p class="error">${escapeHtml(error.message)}</p></div>`;
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c]));
}
</script>
</body>
</html>
