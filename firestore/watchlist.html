<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library — VEYORA</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/watchlist.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="home.html">VEYORA</a>
    <nav>
        <a href="home.html">Home</a>
        <a href="search.html">Search</a>
        <a class="active" href="watchlist.html">My Library</a>
        <a href="profile.html">Profile</a>
    </nav>
</header>

<main class="library-page">
    <section class="library-header">
        <div>
            <p class="eyebrow">YOUR COLLECTION</p>
            <h1>My Library</h1>
            <p>Keep everything you watch organized in one place.</p>
        </div>
        <a class="primary-link" href="search.html">+ Find something</a>
    </section>

    <section class="stats" id="stats"></section>

    <div class="tabs" id="typeTabs">
        <button class="active" data-type="all">All</button>
        <button data-type="anime">🎌 Anime</button>
        <button data-type="tv">🇰🇷 K-Drama</button>
        <button data-type="movie">🎬 Movies</button>
    </div>

    <div class="status-tabs" id="statusTabs">
        <button class="active" data-status="all">All</button>
        <button data-status="watching">Watching</button>
        <button data-status="completed">Completed</button>
        <button data-status="plan_to_watch">Plan to Watch</button>
        <button data-status="on_hold">On Hold</button>
        <button data-status="dropped">Dropped</button>
        <button data-status="favorites">❤️ Favorites</button>
    </div>

    <p id="libraryStatus" class="library-status">Loading your library...</p>
    <section id="libraryGrid" class="library-grid"></section>
</main>

<script type="module" src="js/pages/watchlist.js"></script>
</body>
</html>
