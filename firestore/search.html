<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search — VEYORA</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/search.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="home.html">VEYORA</a>
        <nav>
            <a href="home.html">Home</a>
            <a class="active" href="search.html">Search</a>
            <a href="watchlist.html">My Library</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main class="search-page">
        <section class="search-hero">
            <h1>Find something to watch</h1>
            <p>Search anime, movies, TV shows, and K-dramas.</p>
            <form id="searchForm" class="search-form">
                <input id="searchInput" type="search" placeholder="Search a title..." autocomplete="off" required>
                <button type="submit">Search</button>
            </form>
            <div class="filters">
                <button data-category="all" class="active">All</button>
                <button data-category="anime">Anime</button>
                <button data-category="movie">Movies</button>
                <button data-category="tv">TV / K-Drama</button>
            </div>
        </section>

        <div id="searchStatus" class="search-status"></div>
        <section id="results" class="results-grid"></section>
    </main>

    <script type="module" src="js/pages/search.js"></script>
</body>
</html>
